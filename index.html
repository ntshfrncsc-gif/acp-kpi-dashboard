<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACP KPI Dashboard</title>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.5.0/Recharts.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a1628; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.3); border-radius: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;
    const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, CartesianGrid } = Recharts;

    const DASHBOARD_PASSWORD = "Achieve2026";

    const KPI_CARDS = [
      { label: "Loans Funded", value: "45", target: "50", icon: "🏦", pct: 90 },
      { label: "Total Loan Value", value: "$6.86M", target: "$8M", icon: "💰", pct: 86 },
      { label: "Capital Deployed", value: "$6.86M", target: "$7M", icon: "🏗️", pct: 98 },
      { label: "Pipeline Value", value: "$1.64M", target: "$2.5M", icon: "📊", pct: 66 },
      { label: "Loans in Pipeline", value: "12", target: "20", icon: "🔄", pct: 60 },
      { label: "# of Draws", value: "11", target: "8", icon: "📤", pct: 100, over: true },
      { label: "Draw Amount", value: "$76,080", target: "$75,000", icon: "💵", pct: 100, over: true },
      { label: "Interest Collected", value: "$491", target: "—", icon: "📈", pct: null },
      { label: "Fees Collected", value: "$2,600", target: "$7,500", icon: "🧾", pct: 35 },
      { label: "Loans Closed MTD", value: "1", target: "10", icon: "✅", pct: 10 },
      { label: "Closed Loan Amt", value: "$80,000", target: "$1M", icon: "🔒", pct: 8 },
      { label: "Returned Payments", value: "1", target: "0", icon: "⚠️", pct: null, alert: true },
    ];

    const TREND_DATA = [
      { week: "May 1–3",   draws: 2,  drawAmt: 17900,  pipeline: 1640500, capital: 6126005 },
      { week: "May 4–10",  draws: 5,  drawAmt: 30550,  pipeline: 1759500, capital: 6170625 },
      { week: "May 11–17", draws: 11, drawAmt: 76080,  pipeline: 1640500, capital: 6862500 },
    ];

    const MATURITY_DATA = [
      { borrower: "CRGD Holdings, LLC",                  maturity: "Apr 01, 2025", days: -416, note: 0,       risk: "PAST DUE" },
      { borrower: "Country Meadows Grandview LLC",        maturity: "Dec 31, 2025", days: -142, note: 82680,   risk: "PAST DUE" },
      { borrower: "Rice Pegher Capital LLC",              maturity: "Mar 16, 2026", days: -67,  note: 200000,  risk: "PAST DUE" },
      { borrower: "Scotlands War Chest, LLC",             maturity: "May 28, 2026", days: 6,    note: 290000,  risk: "CRITICAL" },
      { borrower: "MOR Properties LLC",                  maturity: "Jun 10, 2026", days: 19,   note: 175000,  risk: "CRITICAL" },
      { borrower: "RIC Eagle Management, LLC",           maturity: "Jun 12, 2026", days: 21,   note: 187000,  risk: "CRITICAL" },
      { borrower: "Build 412, LLC",                      maturity: "Jun 18, 2026", days: 27,   note: 415000,  risk: "CRITICAL" },
      { borrower: "Empire Real Homes II, LLC",           maturity: "Jun 20, 2026", days: 29,   note: 110000,  risk: "CRITICAL" },
      { borrower: "Empire Real Homes III, LLC",          maturity: "Jun 25, 2026", days: 34,   note: 121500,  risk: "WARNING" },
      { borrower: "Empire Real Homes III, LLC",          maturity: "Jun 25, 2026", days: 34,   note: 110500,  risk: "WARNING" },
      { borrower: "ADT Two LLC",                         maturity: "Jul 02, 2026", days: 41,   note: 245000,  risk: "WARNING" },
      { borrower: "Empire Real Homes III, LLC",          maturity: "Jul 03, 2026", days: 42,   note: 96000,   risk: "WARNING" },
      { borrower: "Empire Real Homes III, LLC",          maturity: "Jul 03, 2026", days: 42,   note: 155000,  risk: "WARNING" },
      { borrower: "RIC Eagle Management, LLC",           maturity: "Jul 24, 2026", days: 63,   note: 270000,  risk: "OK" },
      { borrower: "RIC Eagle Management, LLC",           maturity: "Jul 31, 2026", days: 70,   note: 97000,   risk: "OK" },
      { borrower: "5th St Capital Partners LLC",         maturity: "Aug 01, 2026", days: 71,   note: 400000,  risk: "OK" },
      { borrower: "The Merriano Group LLC",              maturity: "Sep 22, 2026", days: 123,  note: 147500,  risk: "OK" },
      { borrower: "Open Door Realty LLC",                maturity: "Sep 30, 2026", days: 131,  note: 112000,  risk: "OK" },
      { borrower: "Industrial Marketing Solutions, LLC", maturity: "Oct 05, 2026", days: 136,  note: 105000,  risk: "OK" },
      { borrower: "Valley Revival LLC",                  maturity: "Oct 08, 2026", days: 139,  note: 105000,  risk: "OK" },
    ];

    const fmtDollar = (n) => n >= 1000000 ? `$${(n/1000000).toFixed(2)}M` : n >= 1000 ? `$${(n/1000).toFixed(0)}K` : `$${n.toLocaleString()}`;

    const RISK_CFG = {
      "PAST DUE": { bg: "rgba(239,68,68,0.15)",  color: "#ef4444", border: "rgba(239,68,68,0.3)",  bar: "#ef4444" },
      "CRITICAL": { bg: "rgba(249,115,22,0.15)", color: "#f97316", border: "rgba(249,115,22,0.3)", bar: "#f97316" },
      "WARNING":  { bg: "rgba(234,179,8,0.15)",  color: "#eab308", border: "rgba(234,179,8,0.3)",  bar: "#eab308" },
      "OK":       { bg: "rgba(34,197,94,0.1)",   color: "#22c55e", border: "rgba(34,197,94,0.2)",  bar: "#22c55e" },
    };

    function LoginScreen({ onLogin }) {
      const [pw, setPw] = useState("");
      const [err, setErr] = useState(false);
      const attempt = () => {
        if (pw === DASHBOARD_PASSWORD) onLogin();
        else { setErr(true); setTimeout(() => setErr(false), 2000); }
      };
      return (
        <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center",
          background:"linear-gradient(135deg,#0a1628 0%,#0d2144 50%,#0a1628 100%)", padding:24 }}>
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@700&display=swap');
            .pw-input:focus { outline:none; border-color:#c9a84c !important; box-shadow:0 0 0 3px rgba(201,168,76,0.15); }
            .login-btn:hover { background:#b8973e !important; }
          `}</style>
          <div style={{ background:"rgba(255,255,255,0.04)", backdropFilter:"blur(20px)",
            border:"1px solid rgba(201,168,76,0.2)", borderRadius:20, padding:"48px 40px",
            maxWidth:400, width:"100%", boxShadow:"0 40px 80px rgba(0,0,0,0.5)", fontFamily:"'DM Sans',sans-serif" }}>
            <div style={{ textAlign:"center", marginBottom:36 }}>
              <div style={{ fontSize:40, marginBottom:12 }}>🏦</div>
              <div style={{ fontFamily:"'Playfair Display',serif", fontSize:22, color:"#c9a84c", fontWeight:700 }}>
                Achieve Capital Partners
              </div>
              <div style={{ fontSize:12, color:"rgba(255,255,255,0.4)", marginTop:6, letterSpacing:"0.12em", textTransform:"uppercase" }}>
                KPI Dashboard
              </div>
            </div>
            <div style={{ fontSize:11, color:"rgba(255,255,255,0.5)", marginBottom:8, letterSpacing:"0.08em", textTransform:"uppercase" }}>Password</div>
            <input className="pw-input" type="password" value={pw}
              onChange={e => setPw(e.target.value)} onKeyDown={e => e.key==="Enter" && attempt()}
              placeholder="Enter password"
              style={{ width:"100%", padding:"14px 16px", borderRadius:10, background:"rgba(255,255,255,0.06)",
                border: err ? "1px solid #ef4444" : "1px solid rgba(255,255,255,0.1)",
                color:"#fff", fontSize:15, marginBottom:8, transition:"all 0.2s", boxSizing:"border-box" }} />
            {err && <div style={{ color:"#ef4444", fontSize:12, marginBottom:8 }}>Incorrect password.</div>}
            <button className="login-btn" onClick={attempt}
              style={{ width:"100%", padding:14, background:"#c9a84c", border:"none", borderRadius:10,
                color:"#0a1628", fontWeight:600, fontSize:15, cursor:"pointer", transition:"all 0.2s",
                fontFamily:"'DM Sans',sans-serif", marginTop:4 }}>
              Access Dashboard
            </button>
          </div>
        </div>
      );
    }

    function KpiCard({ card, idx }) {
      const barColor = card.alert ? "#ef4444" : card.over ? "#22c55e" : !card.pct ? "#555" : card.pct < 30 ? "#ef4444" : card.pct < 70 ? "#f59e0b" : "#22c55e";
      return (
        <div style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.08)",
          borderRadius:14, padding:"18px 20px" }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:10 }}>
            <div style={{ fontSize:11, color:"rgba(255,255,255,0.4)", textTransform:"uppercase", letterSpacing:"0.1em" }}>{card.label}</div>
            <div style={{ fontSize:20 }}>{card.icon}</div>
          </div>
          <div style={{ fontSize:26, fontWeight:700, color: card.alert ? "#ef4444" : "#fff", marginBottom:4,
            fontFamily:"'Playfair Display',serif" }}>{card.value}</div>
          {card.target !== "—" && card.pct !== null && (
            <>
              <div style={{ fontSize:11, color:"rgba(255,255,255,0.35)", marginBottom:8 }}>
                Target: {card.target} · {card.pct}%{card.over ? " ✓" : ""}
              </div>
              <div style={{ height:4, background:"rgba(255,255,255,0.08)", borderRadius:2, overflow:"hidden" }}>
                <div style={{ height:"100%", width:`${Math.min(card.pct,100)}%`, background:barColor, borderRadius:2 }} />
              </div>
            </>
          )}
          {card.target === "—" && <div style={{ fontSize:11, color:"rgba(255,255,255,0.3)" }}>MTD</div>}
        </div>
      );
    }

    function RiskBadge({ risk }) {
      const c = RISK_CFG[risk] || {};
      return (
        <span style={{ fontSize:10, fontWeight:600, padding:"2px 8px", borderRadius:20,
          background:c.bg, color:c.color, border:`1px solid ${c.border}`, whiteSpace:"nowrap" }}>
          {risk}
        </span>
      );
    }

    function Dashboard() {
      const [loggedIn, setLoggedIn] = useState(false);
      const [tab, setTab] = useState("overview");
      const [filter, setFilter] = useState("ALL");

      if (!loggedIn) return <LoginScreen onLogin={() => setLoggedIn(true)} />;

      const pastDue = MATURITY_DATA.filter(l => l.risk === "PAST DUE").length;
      const critical = MATURITY_DATA.filter(l => l.risk === "CRITICAL").length;
      const filtered = filter === "ALL" ? MATURITY_DATA : MATURITY_DATA.filter(l => l.risk === filter);

      const CHARTS = [
        { key:"draws",    label:"# of Draws",         color:"#c9a84c", fmt: v => v },
        { key:"drawAmt",  label:"Draw Amount",         color:"#60a5fa", fmt: fmtDollar },
        { key:"pipeline", label:"Pipeline Value",      color:"#a78bfa", fmt: fmtDollar },
        { key:"capital",  label:"Capital Deployed",    color:"#34d399", fmt: fmtDollar },
      ];

      return (
        <div style={{ minHeight:"100vh", background:"linear-gradient(160deg,#0a1628 0%,#0d1f3c 100%)",
          fontFamily:"'DM Sans',sans-serif", color:"#fff" }}>
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@700&display=swap');
            .tab-btn:hover { background:rgba(201,168,76,0.08) !important; }
            .mat-row:hover { background:rgba(255,255,255,0.05) !important; }
            .chip:hover { border-color:rgba(201,168,76,0.5) !important; }
          `}</style>

          {/* Header */}
          <div style={{ background:"rgba(0,0,0,0.3)", backdropFilter:"blur(20px)",
            borderBottom:"1px solid rgba(201,168,76,0.15)", padding:"14px 20px",
            position:"sticky", top:0, zIndex:100 }}>
            <div style={{ maxWidth:900, margin:"0 auto" }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
                <div>
                  <div style={{ fontFamily:"'Playfair Display',serif", fontSize:18, color:"#c9a84c", fontWeight:700 }}>
                    Achieve Capital Partners
                  </div>
                  <div style={{ fontSize:11, color:"rgba(255,255,255,0.4)", letterSpacing:"0.1em", textTransform:"uppercase" }}>
                    KPI Dashboard · May 11–17, 2026
                  </div>
                </div>
                <div style={{ textAlign:"right" }}>
                  {pastDue > 0 && <div style={{ fontSize:11, color:"#ef4444", fontWeight:600 }}>⚠ {pastDue} Past Due</div>}
                  {critical > 0 && <div style={{ fontSize:11, color:"#f97316", fontWeight:600 }}>🔴 {critical} Critical</div>}
                </div>
              </div>
              <div style={{ display:"flex", gap:4 }}>
                {[["overview","📊 Overview"],["trends","📈 Trends"],["maturity","⏰ Maturity"]].map(([id,label]) => (
                  <button key={id} className="tab-btn" onClick={() => setTab(id)} style={{
                    padding:"6px 14px", borderRadius:8, border:"none", cursor:"pointer",
                    background: tab===id ? "rgba(201,168,76,0.15)" : "transparent",
                    color: tab===id ? "#c9a84c" : "rgba(255,255,255,0.5)",
                    fontSize:13, fontWeight: tab===id ? 600 : 400,
                    borderBottom: tab===id ? "2px solid #c9a84c" : "2px solid transparent",
                    transition:"all 0.2s", fontFamily:"'DM Sans',sans-serif"
                  }}>{label}</button>
                ))}
              </div>
            </div>
          </div>

          <div style={{ maxWidth:900, margin:"0 auto", padding:"20px 16px 60px" }}>

            {/* OVERVIEW */}
            {tab === "overview" && (
              <div>
                <div style={{ fontSize:11, color:"rgba(255,255,255,0.3)", marginBottom:14, letterSpacing:"0.1em", textTransform:"uppercase" }}>
                  Weekly KPI Summary
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(155px,1fr))", gap:12 }}>
                  {KPI_CARDS.map((c,i) => <KpiCard key={i} card={c} idx={i} />)}
                </div>
                <div style={{ marginTop:20, background:"rgba(239,68,68,0.08)", border:"1px solid rgba(239,68,68,0.2)",
                  borderRadius:12, padding:"14px 18px", display:"flex", gap:12, alignItems:"flex-start" }}>
                  <span style={{ fontSize:22 }}>⚠️</span>
                  <div>
                    <div style={{ fontSize:13, fontWeight:600, color:"#ef4444", marginBottom:3 }}>
                      3 loans are past maturity — action required
                    </div>
                    <div style={{ fontSize:12, color:"rgba(255,255,255,0.5)" }}>
                      CRGD Holdings (416d), Country Meadows Grandview (142d), Rice Pegher Capital (67d) — see Maturity tab
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TRENDS */}
            {tab === "trends" && (
              <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
                <div style={{ fontSize:11, color:"rgba(255,255,255,0.3)", letterSpacing:"0.1em", textTransform:"uppercase" }}>
                  Weekly Trends — May 2026
                </div>
                {CHARTS.map(ch => (
                  <div key={ch.key} style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.07)", borderRadius:14, padding:"16px" }}>
                    <div style={{ fontSize:11, color:"rgba(255,255,255,0.5)", marginBottom:10, letterSpacing:"0.08em", textTransform:"uppercase" }}>
                      {ch.label}
                    </div>
                    <ResponsiveContainer width="100%" height={130}>
                      <BarChart data={TREND_DATA} margin={{ top:4, right:4, bottom:0, left:0 }}>
                        <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.05)" vertical={false} />
                        <XAxis dataKey="week" tick={{ fill:"rgba(255,255,255,0.4)", fontSize:10 }} axisLine={false} tickLine={false} />
                        <YAxis hide />
                        <Tooltip contentStyle={{ background:"#0d1f3c", border:"1px solid rgba(201,168,76,0.2)", borderRadius:8, fontSize:12 }}
                          labelStyle={{ color:"#c9a84c" }} formatter={v => [ch.fmt(v), ch.label]} />
                        <Bar dataKey={ch.key} fill={ch.color} radius={[4,4,0,0]} />
                      </BarChart>
                    </ResponsiveContainer>
                  </div>
                ))}
              </div>
            )}

            {/* MATURITY */}
            {tab === "maturity" && (
              <div>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14, flexWrap:"wrap", gap:10 }}>
                  <div style={{ fontSize:11, color:"rgba(255,255,255,0.3)", letterSpacing:"0.1em", textTransform:"uppercase" }}>
                    Loans Nearing / Past Maturity
                  </div>
                  <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                    {["ALL","PAST DUE","CRITICAL","WARNING","OK"].map(f => (
                      <button key={f} className="chip" onClick={() => setFilter(f)} style={{
                        padding:"4px 12px", borderRadius:20, fontSize:11, cursor:"pointer",
                        background: filter===f ? "rgba(201,168,76,0.15)" : "transparent",
                        color: filter===f ? "#c9a84c" : "rgba(255,255,255,0.4)",
                        border:`1px solid ${filter===f ? "rgba(201,168,76,0.4)" : "rgba(255,255,255,0.1)"}`,
                        transition:"all 0.2s", fontFamily:"'DM Sans',sans-serif"
                      }}>{f}</button>
                    ))}
                  </div>
                </div>
                <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                  {filtered.map((loan,i) => (
                    <div key={i} className="mat-row" style={{
                      background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.07)",
                      borderLeft:`3px solid ${RISK_CFG[loan.risk]?.bar}`,
                      borderRadius:"0 12px 12px 0", padding:"14px 16px", transition:"background 0.15s"
                    }}>
                      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8 }}>
                        <div style={{ flex:1, minWidth:0 }}>
                          <div style={{ fontSize:13, fontWeight:600, color:"#fff", marginBottom:4,
                            whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>
                            {loan.borrower}
                          </div>
                          <div style={{ display:"flex", gap:12, flexWrap:"wrap" }}>
                            <span style={{ fontSize:12, color:"rgba(255,255,255,0.45)" }}>📅 {loan.maturity}</span>
                            <span style={{ fontSize:12, color:"rgba(255,255,255,0.45)" }}>
                              {loan.days < 0 ? `${Math.abs(loan.days)}d overdue` : `${loan.days}d remaining`}
                            </span>
                            {loan.note > 0 && <span style={{ fontSize:12, color:"rgba(255,255,255,0.45)" }}>💰 {fmtDollar(loan.note)}</span>}
                          </div>
                        </div>
                        <RiskBadge risk={loan.risk} />
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<Dashboard />);
  </script>
</body>
</html>
